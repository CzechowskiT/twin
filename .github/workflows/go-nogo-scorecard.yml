name: go-nogo-scorecard

on:
  workflow_dispatch:

jobs:
  scorecard-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend pytest (excluding nightly integration)
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python3 -m pytest tests/ -q --ignore=tests/test_nightly_auto_apply_integration.py
      - name: Frontend launch guards
        working-directory: frontend
        run: |
          npm ci
          npm run test:public-launch-readiness-guard
          npm run test:integration-tooling-guards
          npm run test:public-route-reference-guard
          npm run test:founder-launch-scope-decision-guard
          npm run build
      - name: Scorecard doc exists
        run: test -f docs/PUBLIC_LAUNCH_9_OF_10_SCORECARD.md
