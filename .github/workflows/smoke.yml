name: smoke

on:

  push:

    branches:

      - cursor/phase1-monorepo-scaffold

      - main

    paths-ignore:

      - docs/**

      - "**/*.md"

  pull_request:

    paths-ignore:

      - docs/**

      - "**/*.md"

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: |
          pytest tests/test_health_features.py \
            tests/test_public_mvp_stats.py \
            tests/test_stripe_tier_mapping.py \
            tests/test_rocketjobs_parser.py \
            tests/test_recruiter_inbox.py \
            tests/test_nightly_auto_apply_mail.py \
            tests/test_ops_demo_refresh.py \
            tests/test_candidate_intelligence.py \
            -q
      - name: Candidate intelligence offline eval harness
        working-directory: ${{ github.workspace }}
        run: python3 scripts/candidate-intelligence-eval-harness.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  prod-health:
    if: github.event_name == 'push' && github.ref == 'refs/heads/cursor/phase1-monorepo-scaffold'
    runs-on: ubuntu-latest
    needs: [backend-smoke, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Prod API + frontend smoke
        run: chmod +x scripts/verify-prod-health.sh && ./scripts/verify-prod-health.sh

  production-regression:
    if: github.event_name == 'push' && github.ref == 'refs/heads/cursor/phase1-monorepo-scaffold'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-smoke, frontend-build]
    steps:
      - name: Wait for production SHA and verify negative artifact gate
        env:
          API_HEALTH: https://twin-production-bcd9.up.railway.app/api/v1/health
          DISPATCHER_HEALTH: https://twin-production-bcd9.up.railway.app/api/internal/agent-dispatch/health
          FRONTEND_HEALTH: https://twin-sooty.vercel.app/api/public-health
        run: |
          wait_for_sha() {
            local label="$1"
            local url="$2"
            local field="$3"
            for attempt in $(seq 1 60); do
              deployed=$(curl -fsS --max-time 15 "$url" | \
                FIELD="$field" python3 -c \
                'import json,os,sys; print(json.load(sys.stdin).get(os.environ["FIELD"], ""))' || true)
              if [[ "$deployed" == "$GITHUB_SHA" ]]; then
                echo "$label production SHA verified"
                return 0
              fi
              echo "$label deployment pending ($attempt/60)"
              sleep 15
            done
            echo "$label did not deploy $GITHUB_SHA"
            return 1
          }
          wait_for_sha API "$API_HEALTH" git_commit
          wait_for_sha frontend "$FRONTEND_HEALTH" frontend_commit
          canary=$(curl -fsS --max-time 15 "$DISPATCHER_HEALTH" | python3 -c \
            'import json,sys; c=json.load(sys.stdin)["artifact_gate_canary"]; print(c["status"]+" "+str(c.get("reason_code")))')
          test "$canary" = "PASS None"
