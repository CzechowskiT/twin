name: stabilization-monitor

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  prod-public-probes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Public route probe suite (3x repeat)
        env:
          PROBE_REPEATS: "3"
        run: npm run probe:prod-public
      - name: Public health route stability
        run: npm run test:public-health-route-stability
