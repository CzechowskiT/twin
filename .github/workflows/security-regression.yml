name: security-regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - backend/app/**
      - backend/tests/**
      - frontend/scripts/*guard*

jobs:
  security-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend security tests
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python3 -m pytest tests/test_candidate_account_deletion.py \
            tests/test_idempotency_key_naming.py \
            tests/test_recruiter_c3_notification_prefs.py -q
      - name: Frontend security guards
        working-directory: frontend
        run: |
          npm ci
          npm run test:candidate-account-delete-guard
          npm run test:observability-redaction-guard
          npm run test:referral-abuse-controls-guard
