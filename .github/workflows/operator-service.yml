name: operator-service
run-name: operator-${{ inputs.operation }}-${{ inputs.idempotency_key }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Authorized Operator Service operation
        required: true
        type: choice
        options: [merge, regression, diagnose]
      idempotency_key:
        description: Stable operation key
        required: true
        type: string
      pr_number:
        description: Pull request number for merge
        required: false
        type: string
      expected_head_sha:
        description: Exact pull request head SHA
        required: false
        type: string
      expected_sha:
        description: Exact deployed SHA for regression
        required: false
        type: string
      expected_base_ref:
        description: Protected base branch
        required: true
        default: cursor/phase1-monorepo-scaffold
        type: string
      deployment_environment:
        description: GitHub deployment environment
        required: false
        default: Production
        type: string
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
      idempotency_key:
        required: true
        type: string
      pr_number:
        required: false
        type: string
      expected_head_sha:
        required: false
        type: string
      expected_sha:
        required: false
        type: string
      expected_base_ref:
        required: true
        type: string
      deployment_environment:
        required: false
        default: Production
        type: string

# diagnose: read-only / no-op capability probe — never merges, deploys, or mutates repo content.

concurrency:
  group: operator-${{ github.repository }}-${{ inputs.idempotency_key }}
  cancel-in-progress: false

jobs:
  merge:
    if: inputs.operation == 'merge'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      deployments: read
      pull-requests: write
    steps:
      - name: Validate scope and standard-merge exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_REF: ${{ inputs.expected_base_ref }}
          IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == "CzechowskiT/twin" ]]
          [[ "$EXPECTED_BASE_REF" == "cursor/phase1-monorepo-scaffold" ]]
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IDEMPOTENCY_KEY" =~ ^[A-Za-z0-9._:-]{1,160}$ ]]

          pr_json=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")
          actual_head=$(jq -r '.head.sha' <<<"$pr_json")
          actual_base=$(jq -r '.base.ref' <<<"$pr_json")
          [[ "$actual_head" == "$EXPECTED_HEAD_SHA" ]]
          [[ "$actual_base" == "$EXPECTED_BASE_REF" ]]

          if [[ "$(jq -r '.merged' <<<"$pr_json")" == "true" ]]; then
            test -n "$(jq -r '.merge_commit_sha // empty' <<<"$pr_json")"
            exit 0
          fi
          [[ "$(jq -r '.state' <<<"$pr_json")" == "open" ]]

          if [[ "$(jq -r '.draft' <<<"$pr_json")" == "true" ]]; then
            node_id=$(jq -r '.node_id' <<<"$pr_json")
            gh api graphql \
              -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{id}}}' \
              -f id="$node_id" >/dev/null
          fi

          payload=$(jq -cn \
            --arg sha "$EXPECTED_HEAD_SHA" \
            --arg title "Operator Service: merge PR #$PR_NUMBER" \
            '{sha:$sha,commit_title:$title,merge_method:"merge"}')
          result=$(gh api --method PUT "repos/$REPOSITORY/pulls/$PR_NUMBER/merge" --input - <<<"$payload")
          [[ "$(jq -r '.merged' <<<"$result")" == "true" ]]
          [[ "$(jq -r '.sha' <<<"$result")" =~ ^[0-9a-f]{40}$ ]]

  regression:
    if: inputs.operation == 'regression'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      deployments: read
    steps:
      - name: Validate deployed SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_BASE_REF: ${{ inputs.expected_base_ref }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.deployment_environment }}
          IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == "CzechowskiT/twin" ]]
          [[ "$EXPECTED_BASE_REF" == "cursor/phase1-monorepo-scaffold" ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IDEMPOTENCY_KEY" =~ ^[A-Za-z0-9._:-]{1,160}$ ]]

          branch_sha=$(gh api "repos/$REPOSITORY/commits/$EXPECTED_BASE_REF" --jq .sha)
          [[ "$branch_sha" == "$EXPECTED_SHA" ]]
          deployments=$(gh api --method GET "repos/$REPOSITORY/deployments" \
            -f sha="$EXPECTED_SHA" -f environment="$DEPLOYMENT_ENVIRONMENT" -f per_page=10)
          deployment_id=$(jq -r '.[0].id // empty' <<<"$deployments")
          test -n "$deployment_id"
          state=$(gh api "repos/$REPOSITORY/deployments/$deployment_id/statuses?per_page=1" \
            --jq '.[0].state // empty')
          [[ "$state" == "success" ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
      - name: Production regression
        run: chmod +x scripts/verify-prod-health.sh && ./scripts/verify-prod-health.sh

  diagnose:
    if: inputs.operation == 'diagnose'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      deployments: read
      pull-requests: read
    steps:
      - name: No-op GitHub App / Actions capability probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_BASE_REF: ${{ inputs.expected_base_ref }}
          IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == "CzechowskiT/twin" ]]
          [[ "$EXPECTED_BASE_REF" == "cursor/phase1-monorepo-scaffold" ]]
          [[ "$IDEMPOTENCY_KEY" =~ ^[A-Za-z0-9._:-]{1,160}$ ]]

          # Read-only probes — no merge, no deploy, no content mutation.
          full_name=$(gh api "repos/$REPOSITORY" --jq .full_name)
          [[ "$full_name" == "CzechowskiT/twin" ]]

          workflow_count=$(gh api "repos/$REPOSITORY/actions/workflows" --jq .total_count)
          [[ "$workflow_count" =~ ^[0-9]+$ ]]

          gh api "repos/$REPOSITORY/actions/workflows/operator-service.yml" --jq .path \
            | grep -qx '.github/workflows/operator-service.yml'

          # PRs read (list only; do not mutate).
          gh api "repos/$REPOSITORY/pulls?state=open&per_page=1" --jq 'type' | grep -qx 'array'

          # Confirm this run is workflow_dispatch diagnose (Actions write path exercised by dispatch).
          run_json=$(gh api "repos/$REPOSITORY/actions/runs/${{ github.run_id }}")
          [[ "$(jq -r '.event' <<<"$run_json")" == "workflow_dispatch" ]]
          [[ "$(jq -r '.name' <<<"$run_json")" == "operator-service" ]]

          echo "operator_diagnose_ok repository=$full_name workflows=$workflow_count run_id=${{ github.run_id }}"
