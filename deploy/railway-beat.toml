# Railway service: TWIN Celery beat (optional periodic tasks when SCRAPE_BEAT_ENABLED=true).
# Settings → Root directory: backend (same as API).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["**"]

[deploy]
startCommand = "celery -A app.tasks.celery_app beat --loglevel=info"
restartPolicyType = "ON_FAILURE"
