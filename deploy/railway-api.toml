# Railway service: TWIN API
# Dashboard → Service → Settings:
#   - Config file path: deploy/railway-api.toml
#   - Root directory: backend   (required — isolated monorepo)
# With root = backend, Dockerfile lives next to requirements.txt → Dockerfile
#
# Scraping: add Redis + a worker service (deploy/railway-worker.toml), OR leave broker env unset so
# scripts/start-api.sh sets CELERY_TASK_ALWAYS_EAGER=true on Railway (in-process scrape on the API).
# You can also set CELERY_TASK_ALWAYS_EAGER=true explicitly on the API only (demo / single-instance).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Paths are relative to the service root directory (set `backend` in Railway UI).
# Single glob: redeploy on any change under that root (avoids SKIPPED when path layouts differ).
watchPatterns = ["**"]

[deploy]
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
