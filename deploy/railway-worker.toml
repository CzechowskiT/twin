# Railway service: TWIN Celery worker (scraping + background jobs)
# Settings → Root directory: backend (same as API). Config: deploy/railway-worker.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["**"]

[deploy]
startCommand = "celery -A app.tasks.celery_app worker --loglevel=info"
restartPolicyType = "ON_FAILURE"
